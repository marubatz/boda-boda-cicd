name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd app
          npm ci

      - name: Start server in background
        run: |
          cd app
          node index.js &
          sleep 5

      - name: Run API test
        run: node tests/api.test.js

      - name: Build Docker image
        run: docker build -t boda-boda:ci .